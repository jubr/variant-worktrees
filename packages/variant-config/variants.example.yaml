# yaml-language-server: $schema=./variants.yaml.schema.json
#
# Every option of variants.yaml, with an illustrative value. Alternatives are listed after `#` on the same line.
# Every key is optional; an absent one is detected from mise.local.toml / the environment, or takes its default.
# A test keeps this file in step with variants.yaml.schema.json.

# Database connection. Detected from mise.local.toml, then environment variables, when absent.
db:
  dialect: postgres # sqlite | mysql
  url: postgres://app:secret@127.0.0.1:5432/app # replaces host/port/user/password/database when set
  host: 127.0.0.1 # required when `url` is absent and dialect is not sqlite
  port: 5432 # mysql: 3306; or ${POSTGRES_PORT}
  user: app
  password: secret
  database: app
  schema: public # database schema of the main variant
  filename: ./app.sqlite # sqlite only
  ssl: false # true
  multi: # one schema per tenant. Absent: the one schema v_<slug>
    schemaPrefix: v_${slug}- # ${slug} is filled in. Alternate: app_${slug}
    tenantsCmd: sed -rn ${worktree}/server/.env -e 's/^WITCHES=(.*)$/\1/p' # lazy; prints the tenant list
    # tenants: east,west # literal list. Not together with tenantsCmd

# Runtime layout of variants.
variant:
  main: . # the main checkout the worktrees are made from; default: detected (target of a parent AGENTS.md symlink, else the git checkout)
  root: .. # directory that holds the variant worktrees; default: the directory of a parent AGENTS.md symlink into main, else main
  abbr: vw # short project label for hostnames and `${abbr}`; default: initials of the main checkout directory name, e.g. variant-worktrees is vw
  prefix: _v- # starts every name derived from a slug, e.g. _v-add-auth; keep the connector. Alternate: _work-
  baseBranch: main # new variant branches start here, and a variant must be merged here before `implode`
  branchPrefixes: # the first prefixes a new branch; all of them are dropped from a branch name to get a slug
    - feat/
    - fix/
  containerEngine: docker # podman; CONTAINER_ENGINE wins. Absent: docker if installed, else podman
  open: true # false; open URLs in the browser after `up` and `watch`. VARIANT_OPEN=0 turns it off
  ports:
    range: 42000-42999 # free ports of watches and of `variant ui` are picked from here (1024 to 65535); an explicit VARIANT_<KEY>_PORT may lie anywhere
  storage: # per-variant data directory; absent: none
    dir: .storage # relative to the worktree
    envVarName: STORAGE_ROOT # variable amended for commands, set in watch .env
  ui: # the `variant ui` web server
    port: 62100 # VARIANT_UI_PORT wins. Absent: a free port of ports.range
  mise: # Mise supplies the environment (`mise env`)
    binPath: /opt/homebrew/bin/mise # when mise is not on PATH; the editor setting variant.mise.binPath wins
  steps: # map keyed by step name. A custom step sets runBefore or runAfter. Builtins stay in flow order
    provision: # one run; creates every schema and any users/roles it may need
      cmd: bun run db:provision:witches # shell commands
      dir: server # relative to the worktree; default: the worktree root
      env: &prov-env # templated values; win over everything else the command sees
        MULTI_TENANT_LIST: ${multi.tenants} # populated by tenantsCmd
        MULTI_SCHEMA_PREFIX: ${multi.schemaPrefix} # cmd creates v_${slug}-east and the rest
    seed: # one run; seeds every tenant schema
      cmd: bun run db:seed:witches
      dir: server
      env: *prov-env
    migrations: # unique, only [A-Za-z0-9_-]{2,20}, VARIANT_STEP_MIGRATIONS=no skips
      cmd: bun run migrate
      dir: be
      env:
        JWT_SECRET: '${JWT_SECRET:-variant-local-${slug}}' # ${NAME} and ${NAME:-default} read the environment
      filterLinesRegex: '^Migration ' # print only the output lines that match; --verbose and failures print everything
      runAfter: seed # run after the seed step
    report: # the other placement. A step has exactly one of runBefore or runAfter
      cmd: bun run report
      runBefore: watch
    deprovision: # one run; replaces the builtin schema drop
      cmd: bun run db:deprovision:witches
      dir: server
      env: *prov-env
  supervise: # `up` and `watch` timing
    startDelaySeconds: 2 # wait between starting two watches
    readyTimeoutSeconds: 180 # wait for the watches that set `ready`
    checkoutPollSeconds: 5 # how often an attached watch checks that the worktree still exists; 0 turns it off
  implode: # `variant implode` removes the variant and its worktree
    preRm: # `rm -rf`` remove these before validate
      - dist
      - node_modules
      - openspec/changes/${slug}/pr*-demo.webm
    discard: # tracked files whose local changes are discarded
      - bun.lock
    requireMerged: true # false; refuse to implode a variant that is not merged into baseBranch
    maxDiffLines: 200 # kept lines of the filtered git diff -U1 patches; over this, status and stat only
  seed: ./scripts/seed.sh # command that seeds a new variant database; a per-variant `seed` below wins
  watches: # keyed by watch name: runtime state, templates (${be.port}), containers and VARIANT_BE_PORT use the key
    fe:
      kind: vite # nestjs; optional, a label that autodetection sets
      dir: fe
      up: bun run dev
      watch: bun run build:watch
      url: http://${slug}.vw.localhost:${port} # URL template, placeholders ${slug} and ${port}; autodetected vite watches get this default
      env:
        sourceFile: .env # relative to ${dir}, copied to variant `${worktree}/${dir}/.env` and amended
        overrides: # templated values for the watch's commands and the variant .env when it is created
          VITE_API_URL: http://${slug}.vw.localhost:${be.port}
          PUBLIC_BASE_URL: '${url}'
      install: bun install --frozen-lockfile # runs in dir when dir has no node_modules
      ready: /index.html # URL path that answers with a success status when the watch serves
      output: # absent: tty when an enabled extension description contains "log" and "ansi", otherwise no-tty
        mode: tty # no-tty. tty gives the process a terminal so it prints color
      container: # how `up` runs the watch
        dockerfile: fe/Dockerfile # relative to the worktree, built with the worktree as context; FROM nginx:alpine, builds, serves and proxies
    be:
      kind: nestjs
      dir: be
      up: bun run start:docker
      watch: bun run build:watch
      env:
        sourceFile: .env # relative to ${dir}, copied to variant `${worktree}/${dir}/.env` and amended
        overrides: # templated values for the watch's commands and the env file copy when it is created
          PORT: '${be.port}' # free one will be passed
      container:
        dockerfile: be/Dockerfile # `docker run --rm -it $(docker build -f ${dir}/Dockerfile -q .)`
        internalPort: 3000 # port inside the container; default 80

# Per-variant overrides, keyed by slug.
variants:
  add-auth:
    seed: ./scripts/seed-auth.sh

# Cursor chat renamer: renames a Cursor chat from its first prompt. Editor settings still win over these values.
chatRenamer:
  trigger: titleEvent # hook
  hookScope: workspace # user; where the hook is installed when trigger is hook
  activationPatterns: # regular expressions tested per prompt line; the first capture group is the title
    - '/[a-z]+-spec-[a-z]+\s+([A-Za-z0-9_-]+)'
  worktreePrefixes: # prefixes (with connector) of worktree folders whose dragged-in path names a chat
    - _v- # default: variant.prefix (above); list them here only to replace it, e.g. _work-
  renameExistingDays: 7 # 0 turns off renaming of chats that existed before the editor started
  titleEventPromptLines: 10 # how many lines of a new chat's first prompt the title event tests (at least 1)
  awake:
    # Follows this window's turn events and also polls the first 20 last-focused composers every 5 seconds.
    # The startup line names agentHost+poll or poll. variant.log.highVolumeCategories is an opt-in checkbox
    # list whose first entry is awake.agentHostEvents.
    when: chatsActive # never; hold the Mac awake while a chat is taking a turn or generating
    cmd: "caffeinate -disu -w ${extensionHostPid}" # detected default; ${extensionHostPid} is this host's pid
    graceDelaySecs: 180 # seconds to stay awake after the last turn; 0 stops at once. An idle chat does not count
