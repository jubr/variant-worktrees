# toml-language-server: $schema=https://mise.jdx.dev/schema/mise.json

[tools]
actionlint = "1.7.12"
bun = "1.4.2"
hk = "1.56.1"
jq = "1.8.1"
shellcheck = "0.11.0"
task = "3.44.0"
yq = "4.53.3"

# AIDEV-NOTE: node is npm-backend runtime for commitlint/openspec shims, not the
# package toolchain (those stay bun). mise installs `node` before `npm:.`
# https://mise.jdx.dev/dev-tools/backends/npm.html
node = "22.21.1"
"npm:@commitlint/cli" = "21.2.2"
"npm:@commitlint/config-conventional" = "21.2.2"
"npm:@fission-ai/openspec" = "1.11.0"

[env]
HK_MISE = "1"
HK = "1" # explicitly enable

[hooks]
postinstall = """
    task install
"""

[settings.npm]
#bun = true # use bun for npm backend
