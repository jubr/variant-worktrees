name: bun-standalone

# Specification: openspec/specs/meta/bun-standalone-build/spec.md
# AIDEV-NOTE: the pull request is upstream, so no push here announces a new head.
# The schedule (default branch only) resolves the head; the binary cache key holds
# that head and the hash of this file, so only a moved head or an edit compiles.
on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/bun-standalone.yaml
  # AIDEV-NOTE: the CI workflow calls this; the release restores the binaries under these keys.
  workflow_call:
    outputs:
      sha:
        description: Head commit of the upstream pull request
        value: ${{ jobs.resolve.outputs.sha }}
      workflow:
        description: Hash of this workflow file
        value: ${{ jobs.resolve.outputs.workflow }}

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so a release run never queues behind (or replaces) a push run.
  group: bun-standalone-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUN_REPOSITORY: oven-sh/bun
  BUN_PULL_REQUEST: "32262"

jobs:
  resolve:
    name: Resolve the pull request head
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.head.outputs.sha }}
      workflow: ${{ steps.workflow.outputs.hash }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/workflows/bun-standalone.yaml
          sparse-checkout-cone-mode: false
      # AIDEV-NOTE: hashed here because only this job checks out this repository; the build job checks out Bun.
      - name: Hash this workflow
        id: workflow
        run: echo "hash=${{ hashFiles('.github/workflows/bun-standalone.yaml') }}" >> "$GITHUB_OUTPUT"
      - name: Read the head commit
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(gh api "repos/${BUN_REPOSITORY}/pulls/${BUN_PULL_REQUEST}" --jq .head.sha)"
          if ! [[ "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "cannot read the head of ${BUN_REPOSITORY}#${BUN_PULL_REQUEST}" >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 2G
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            runner: macos-15
          - target: darwin-x64
            runner: macos-15-intel
          - target: linux-x64
            runner: ubuntu-24.04
          - target: linux-arm64
            runner: ubuntu-24.04-arm
    steps:
      # Hit: the stripped binary of an earlier run with this head and this workflow. Miss: everything below compiles.
      - name: Restore the finished binary
        id: binary
        uses: actions/cache@v6
        with:
          path: build/release-standalone/bun-standalone
          key: bun-standalone-${{ matrix.target }}-${{ needs.resolve.outputs.sha }}-${{ needs.resolve.outputs.workflow }}

      - name: Check out the pull request head
        if: steps.binary.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: ${{ env.BUN_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 1

      - name: Set up Bun
        if: steps.binary.outputs.cache-hit != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install the toolchain (macOS)
        if: steps.binary.outputs.cache-hit != 'true' && runner.os == 'macOS'
        run: |
          brew install llvm@21 cmake ninja ccache pkg-config automake libtool go ruby gnu-sed
          echo "$(brew --prefix llvm@21)/bin" >> "$GITHUB_PATH"
          echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"

      - name: Install the toolchain (Linux)
        if: steps.binary.outputs.cache-hit != 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build ccache pkg-config golang xz-utils \
            make nasm python3 libtool ruby perl curl lsb-release software-properties-common gnupg
          curl -fsSL https://apt.llvm.org/llvm.sh -o /tmp/llvm.sh
          sudo bash /tmp/llvm.sh 21 all

      - name: Install the pinned Rust nightly
        if: steps.binary.outputs.cache-hit != 'true'
        run: |
          channel="$(sed -n 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"\(.*\)"/\1/p' rust-toolchain.toml | head -1)"
          rustup toolchain install "$channel" --profile minimal --component rust-src,llvm-tools
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # A stale entry only costs time, so these restore by prefix; the run id makes every compile save a fresh one.
      - name: Restore dependencies and compiler output
        id: dependencies
        if: steps.binary.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: |
            ~/.bun/build-cache
            vendor
            .ccache
          key: bun-standalone-deps-${{ matrix.target }}-${{ needs.resolve.outputs.sha }}-${{ github.run_id }}
          restore-keys: |
            bun-standalone-deps-${{ matrix.target }}-

      # Specification: openspec/specs/meta/bun-standalone-build/spec.md (Smaller runtime through source patches)
      # AIDEV-NOTE: sed patches over the upstream checkout, so Bun needs no fork; the diff -u of each file lands in the log.
      # A patch that matches nothing fails the step, which is how an upstream rewrite of these lines shows up.
      # Editing this step changes the hash of this file, so it also starts a new compile.
      - name: Patch Bun for a smaller runtime
        id: patch
        if: steps.binary.outputs.cache-hit != 'true'
        run: |
          SED="$(command -v gsed || command -v sed)"

          # apply FILE SED-ARGS...: edit FILE in place, print the unified diff, fail when nothing changed.
          apply() {
            local file="$1"
            shift
            cp "$file" "$file.orig"
            "$SED" -E -i "$@" "$file"
            if diff -u --label "a/$file" --label "b/$file" "$file.orig" "$file"; then
              echo "::error::the sed patch did not change $file" >&2
              exit 1
            fi
            rm "$file.orig"
          }

          # add FILE: write stdin to a new FILE and print it as a diff against nothing.
          add() {
            cat > "$1"
            diff -u --label /dev/null --label "b/$1" /dev/null "$1" || true
          }

          # MinSizeRel: C++ gets -Oz instead of -Os (first match only: the LTO entry further down stays), and the Rust half gets opt-level z.
          apply scripts/build/flags.ts -e '0,/flag: "-Os",/s//flag: "-Oz",/'
          apply scripts/build/rust.ts \
            -e '/^  if \(rustflags\.length > 0\) env\.CARGO_ENCODED_RUSTFLAGS/i\  if (cfg.smol) env.CARGO_PROFILE_RELEASE_OPT_LEVEL = "z";'

          # Bun.Image: the module becomes a stub, which keeps libjpeg-turbo, libspng and libwebp out of the link.
          apply src/runtime/lib.rs \
            -e 's|^pub mod image;$|#[cfg(not(bun_standalone))]\npub mod image;\n#[cfg(bun_standalone)]\n#[path = "image_standalone_stub.rs"]\npub mod image;|'
          apply src/runtime/api/BunObject.rs \
            -e 's|^pub\(crate\) fn get_image_constructor\(global_this: &JSGlobalObject, _: &JSObject\) -> JSValue \{$|#[cfg(bun_standalone)]\npub(crate) fn get_image_constructor(_: \&JSGlobalObject, _: \&JSObject) -> JSValue {\n    JSValue::UNDEFINED\n}\n\n#[cfg(not(bun_standalone))]\n&|'
          apply src/runtime/webcore/Body.rs \
            -e 's|^( *)if let Some\(image\) = value\.as_class_ref::<crate::image::Image>\(\) \{$|\1#[cfg(not(bun_standalone))]\n&|'
          apply src/runtime/image/Image.classes.ts \
            -e 's|^    name: "Image",$|&\n    standaloneStub: "Bun.Image is not available in standalone executables",|'
          add src/runtime/image_standalone_stub.rs <<'RUST'
          //! `cfg(bun_standalone)` replacement for `crate::image` (`Bun.Image`).
          //!
          //! The real module (codecs, CoreGraphics/WIC backends, `Image` class) pulls in
          //! libjpeg-turbo, libspng and libwebp and is not needed by a `--compile`d
          //! executable that only runs its own JS. The codegen `standaloneStub` flag on
          //! `Image.classes.ts` emits a ZST `Image` plus throwing thunks so the C++
          //! `extern` symbols still link; this file provides the few Rust-side names
          //! other modules reference.

          #![allow(dead_code, unused_variables)]

          use core::marker::PhantomData;

          use bun_jsc::{JSGlobalObject, JSValue, JsResult, JsTerminated};

          pub(crate) const UNAVAILABLE: &str = "Bun.Image is not available in standalone executables";

          /// Never constructed; `from_blob_js` (`Blob.image()`) throws first.
          pub struct Image;

          impl Image {
              pub fn from_blob_js(global: &JSGlobalObject, blob_value: JSValue, options: JSValue) -> JsResult<JSValue> {
                  Err(global.throw_type_error(format_args!("{}", UNAVAILABLE)))
              }
          }

          /// Never scheduled (no `Image` can exist), kept so the task dispatch table compiles.
          pub struct AsyncImageTask<'a>(PhantomData<&'a ()>);

          impl AsyncImageTask<'_> {
              pub fn run_from_js(&mut self) -> Result<(), JsTerminated> {
                  Ok(())
              }

              /// # Safety
              /// `_task` is never created, so this is never called.
              pub unsafe fn destroy(_task: *mut Self) {}
          }
          RUST

          # bun:ffi: dlopen, cc, linkSymbols and callback compile C with TinyCC; the stub throws and TinyCC stays unlinked.
          apply src/runtime/ffi/ffi.classes.ts \
            -e 's|^    name: "FFI",$|&\n    standaloneStub: "bun:ffi is not available in standalone executables",|'
          apply src/runtime/ffi/mod.rs \
            -e 's~^use (core::ffi::\{c_char, c_void\}|core::ptr::NonNull|bun_core::ZBox|crate::jsc::JSGlobalObject);$~#[cfg_attr(bun_standalone, allow(unused_imports))]\n&~' \
            -e '/^(mod host_fns;|pub use host_fns::|#\[path = "ffi_body\.rs"\]|use bun_tcc_sys as TCC;|pub\(crate\) fn get_dl_error|pub struct Function \{|impl Default for Function \{|pub static LIB_DIR_Z:|unsafe extern "C" \{|impl Drop for Function \{|impl Function \{|pub enum Step \{|pub struct Compiled \{|impl Default for Compiled \{|impl Step \{|mod abi_type;|pub use abi_type::)/i\#[cfg(not(bun_standalone))]' \
            -e 's~^mod ffi_body;$~&\n#[cfg(bun_standalone)]\n#[path = "ffi_standalone_stub.rs"]\nmod ffi_body;~'
          add src/runtime/ffi/ffi_standalone_stub.rs <<'RUST'
          //! `cfg(bun_standalone)` replacement for `ffi_body` (`bun:ffi` `dlopen`, `cc`,
          //! `linkSymbols`, `callback`). Those compile C with TinyCC at runtime, which a
          //! `--compile`d executable that only runs its own JS does not need. Every entry
          //! point throws; the pointer/read helpers in `FFIObject.rs` are untouched.

          #![allow(dead_code, unused_variables)]

          use bun_core::ZigString;
          use bun_jsc::{CallFrame, JSGlobalObject, JSValue, JsResult};

          const UNAVAILABLE: &str = "bun:ffi is not available in standalone executables";

          /// Never constructed.
          pub struct FFI;

          impl FFI {
              pub fn print(global: &JSGlobalObject, object: JSValue, is_callback_val: Option<JSValue>) -> JsResult<JSValue> {
                  Err(global.throw_type_error(format_args!("{}", UNAVAILABLE)))
              }

              pub fn close_callback(global: &JSGlobalObject, ctx: JSValue) -> JSValue {
                  JSValue::UNDEFINED
              }

              pub fn open(global: &JSGlobalObject, name_str: ZigString, object_value: JSValue) -> JSValue {
                  let _ = global.throw_type_error(format_args!("{}", UNAVAILABLE));
                  JSValue::ZERO
              }

              pub fn callback(global: &JSGlobalObject, interface: JSValue, js_callback: JSValue) -> JsResult<JSValue> {
                  Err(global.throw_type_error(format_args!("{}", UNAVAILABLE)))
              }

              pub fn link_symbols(global: &JSGlobalObject, object_value: JSValue) -> JSValue {
                  let _ = global.throw_type_error(format_args!("{}", UNAVAILABLE));
                  JSValue::ZERO
              }
          }

          #[allow(non_snake_case)]
          pub fn bun__ffi__cc(global: &JSGlobalObject, callframe: &CallFrame) -> JsResult<JSValue> {
              Err(global.throw_type_error(format_args!("{}", UNAVAILABLE)))
          }
          RUST

      - name: Compile bun-standalone
        if: steps.binary.outputs.cache-hit != 'true'
        run: |
          bun install --frozen-lockfile
          bun scripts/build.ts --profile=release --standalone=on --build-type=MinSizeRel --build-dir=build/release-standalone

      # Runs for a restored binary as well, so a bad cache entry cannot ship.
      - name: Smoke test
        id: smoke
        run: |
          exe=build/release-standalone/bun-standalone
          test -x "$exe"
          "$exe" --version
          "$exe" -e 'console.log(Bun.version, process.arch)'
          if "$exe" build ./nothing.ts; then
            echo "bun build must not be available in bun-standalone" >&2
            exit 1
          fi
          "$exe" -e 'if (typeof Bun.Image !== "undefined") process.exit(1)'
          "$exe" -e 'try { require("bun:ffi").dlopen("libc", {}); process.exit(1) } catch (e) { if (!/not available/.test(String(e.message))) process.exit(1) }'

      - name: Package
        run: |
          name="bun-standalone-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp build/release-standalone/bun-standalone "dist/$name/bun-standalone"
          (cd dist && zip -qr "$name.zip" "$name" && rm -r "$name")
          ls -l dist

      - name: Name the head in the summary
        run: |
          {
            echo "### bun-standalone ${{ matrix.target }}"
            echo "- pull request: ${BUN_REPOSITORY}#${BUN_PULL_REQUEST}"
            echo "- head: \`${{ needs.resolve.outputs.sha }}\`"
            echo "- binary: $(stat -c %s build/release-standalone/bun-standalone 2>/dev/null || stat -f %z build/release-standalone/bun-standalone) bytes"
            echo "- compiled in this run: ${{ steps.binary.outputs.cache-hit != 'true' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attach the archive
        uses: actions/upload-artifact@v7
        with:
          name: bun-standalone-${{ matrix.target }}
          path: dist/bun-standalone-${{ matrix.target }}.zip
          if-no-files-found: error
