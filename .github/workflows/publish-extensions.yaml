name: Publish extensions

# Specification: openspec/specs/meta/release-artifacts/spec.md (Manual registry publication)
# Manual only. Publishes the .vsix files attached to one GitHub Release, without
# rebuilding. No long-lived registry tokens: both registries use OIDC trusted
# publishing. Needs a protected `marketplace` environment with required reviewers,
# environment variables AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# (Entra managed identity with a GitHub federated credential, member of the
# Marketplace publisher), and an Open VSX trusted publisher registered for this
# workflow file and the `marketplace` environment.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.2.3"
        type: string
        required: true
      registry:
        description: "Which registry receives the .vsix files"
        type: choice
        options: [both, marketplace, openvsx]
        default: both

permissions:
  contents: read

concurrency:
  group: publish-extensions
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download .vsix assets
        run: |
          if ! gh release view "$TAG" >/dev/null; then
            echo "::error::no release for tag ${TAG}"
            exit 1
          fi
          gh release download "$TAG" --pattern '*.vsix' --dir vsix
          count="$(find vsix -name '*.vsix' | wc -l)"
          if [ "$count" -lt 1 ]; then
            echo "::error::release ${TAG} has no .vsix asset"
            exit 1
          fi
          ls -l vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vsix/*.vsix
          if-no-files-found: error

  publish:
    name: Publish to registries
    needs: validate
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      # AIDEV-NOTE: id-token is the OIDC credential for Azure login and Open VSX; keep it on this job only
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: bun
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix
      - name: Require downloaded .vsix files
        run: |
          count="$(find vsix -name '*.vsix' | wc -l)"
          if [ "$count" -lt 1 ]; then
            echo "::error::publish directory has no .vsix file"
            exit 1
          fi
      - name: Azure login (Entra workload identity federation)
        if: inputs.registry == 'both' || inputs.registry == 'marketplace'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Visual Studio Marketplace
        if: inputs.registry == 'both' || inputs.registry == 'marketplace'
        run: |
          for file in vsix/*.vsix; do
            bunx @vscode/vsce@2.32.0 publish --azure-credential --packagePath "$file"
          done
      - name: Open VSX
        if: inputs.registry == 'both' || inputs.registry == 'openvsx'
        run: |
          for file in vsix/*.vsix; do
            bunx ovsx@1.3.0 publish "$file" --trusted-publishing
          done
