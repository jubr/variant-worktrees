name: Publish extensions

# Specification: openspec/specs/meta/release-artifacts/spec.md (Manual registry publication)
# Manual only. Publishes the .vsix files attached to one GitHub Release, without
# rebuilding. Needs repository secrets VSCE_PAT and OVSX_PAT, and a protected
# `marketplace` environment with required reviewers.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.2.3"
        type: string
        required: true
      registry:
        description: "Which registry receives the .vsix files"
        type: choice
        options: [both, marketplace, openvsx]
        default: both

permissions:
  contents: read

concurrency:
  group: publish-extensions
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download .vsix assets
        run: |
          if ! gh release view "$TAG" >/dev/null; then
            echo "::error::no release for tag ${TAG}"
            exit 1
          fi
          gh release download "$TAG" --pattern '*.vsix' --dir vsix
          count="$(find vsix -name '*.vsix' | wc -l)"
          if [ "$count" -lt 1 ]; then
            echo "::error::release ${TAG} has no .vsix asset"
            exit 1
          fi
          ls -l vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vsix/*.vsix
          if-no-files-found: error

  publish:
    name: Publish to registries
    needs: validate
    runs-on: ubuntu-latest
    environment: marketplace
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install_args: bun
      - uses: actions/download-artifact@v4
        with:
          name: vsix
          path: vsix
      - name: Require downloaded .vsix files
        run: |
          count="$(find vsix -name '*.vsix' | wc -l)"
          if [ "$count" -lt 1 ]; then
            echo "::error::publish directory has no .vsix file"
            exit 1
          fi
      - name: Visual Studio Marketplace
        if: inputs.registry == 'both' || inputs.registry == 'marketplace'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          for file in vsix/*.vsix; do
            bunx @vscode/vsce@2.32.0 publish --packagePath "$file"
          done
      - name: Open VSX
        if: inputs.registry == 'both' || inputs.registry == 'openvsx'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for file in vsix/*.vsix; do
            bunx ovsx@1.3.0 publish "$file" --pat "$OVSX_PAT"
          done
