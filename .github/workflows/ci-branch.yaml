name: CI

# Specification: openspec/specs/meta/ci-feature-builds/spec.md
# AIDEV-NOTE: main is not in `push` on purpose. ci-release.yaml calls this workflow
# for main pushes, so main would otherwise run the whole gate twice.
# AIDEV-NOTE: no pull_request trigger. The push of the pull request head is the
# gate run. A pull_request run uses refs/pull/N/merge and would not be cancelled.
on:
  push:
    branches-ignore: [main]
  workflow_call:
    inputs:
      bun-standalone:
        description: "yes: run the Bun standalone job off main too, to try it without merging"
        type: string
        default: "no"
    outputs:
      bun-standalone-sha:
        description: Upstream pull request head the slim Bun runtime was built from
        value: ${{ jobs.bun-standalone.outputs.sha }}
      bun-standalone-workflow:
        description: Hash of the workflow that built it
        value: ${{ jobs.bun-standalone.outputs.workflow }}

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so a release run never
  # shares a group with (and cancels) the branch's own push run.
  group: ci-branch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Specification: openspec/specs/meta/bun-standalone-build/spec.md (Run by CI on main only)
  # AIDEV-NOTE: a no-op on a cache hit. Skipped on feature-branch pushes (inputs is empty there); a hand
  # dispatch of the release workflow with bun-standalone=yes switches it on for any branch.
  bun-standalone:
    name: Bun standalone
    if: github.ref == 'refs/heads/main' || inputs.bun-standalone == 'yes'
    uses: ./.github/workflows/bun-standalone.yaml
    permissions:
      contents: read

  gate:
    name: Gate and extension packages
    runs-on: ubuntu-latest
    # AIDEV-NOTE: a normal run takes about 3 minutes. Without a limit a hung test run keeps the check pending for 6 hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs origin/main..HEAD
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: task install:ci
      - run: task check:full
      - run: task package:vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: out/*.vsix
          if-no-files-found: error

  node-smoke:
    name: Library and CLI under Node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: task install:ci
      - run: task test:node
