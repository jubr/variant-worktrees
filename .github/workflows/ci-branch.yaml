name: CI

# Specification: openspec/specs/meta/ci-feature-builds/spec.md
# AIDEV-NOTE: main is not in `push` on purpose. ci-release.yaml calls this workflow
# for main pushes, so main would otherwise run the whole gate twice.
# AIDEV-NOTE: no pull_request trigger. The push of the pull request head is the
# gate run. A pull_request run uses refs/pull/N/merge and would not be cancelled.
on:
  push:
    branches-ignore: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # github.workflow is the caller's name when called, so a release run never
  # shares a group with (and cancels) the branch's own push run.
  group: ci-branch-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  gate:
    name: Gate and extension packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint needs origin/main..HEAD
          fetch-depth: 0
      - uses: jdx/mise-action@v5
      - run: task install:ci
      - run: task check:full
      - run: task lint:workflows
      - run: task package:vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: out/*.vsix
          if-no-files-found: error

  node-smoke:
    name: Library and CLI under Node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: task install:ci
      - run: task test:node
