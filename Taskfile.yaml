# yaml-language-server: $schema=https://raw.githubusercontent.com/go-task/task/refs/tags/v3.44.0/website/static/schema.json
version: '3'

# AIDEV-NOTE: bun workspace dispatch. Root package.json remains the workspace
# definition; Taskfile is the agent/human CLI. commitlint/openspec are mise
# npm: tools (node is only their shim runtime, not the package toolchain).

tasks:
  install:
    desc: "Install workspace dependencies (bun install)"
    run: once
    cmds:
      - bun install --no-summary
      - task: bin:bun-shebang
  install:ci:
    desc: "Install workspace dependencies from the committed lockfile"
    cmds:
      - bun install --frozen-lockfile
      - task: bin:bun-shebang

  bin:bun-shebang:
    desc: "Make node_modules/.bin/variant run under bun (no-op until variant-cli is built)"
    cmds: ["scripts/bun-shebang.sh"]

  bootstrap:
    desc: "mise trust/install, then bun install"
    cmds:
      - mise trust .
      - mise install
      - task: install

  parent-symlink-here:
    desc: "Symlink .agents/AGENTS/CONTRIBUTING (and backlog/security if present) into parent"
    vars:
      PARENT: '{{.ROOT_DIR}}/..'
      NAME: { sh: "basename '{{.ROOT_DIR}}'" }
    cmds:
      - >-
        parent='{{.PARENT}}';
        name='{{.NAME}}';
        for rel in .agents .vscode AGENTS.md BACKLOG.md CONTRIBUTING.md SECURITY.md SECURITY-BACKLOG.md;
        do src='{{.ROOT_DIR}}/'"$rel";
        dst="$parent/$rel";
        if [ ! -e "$src" ] && [ ! -L "$src" ];
        then continue;
        fi;
        if [ -e "$dst" ] && [ ! -L "$dst" ];
        then echo "refuse: $dst exists and is not a symlink" >&2;
        exit 1;
        fi;
        ln -sfn "$name/$rel" "$dst";
        echo "$dst -> $name/$rel";
        done

  lint:
    desc: "Lint packages (biome check)"
    cmds: ["bun run lint"]
  lint:fix:
    desc: "Write biome lint/format fixes"
    aliases: ["format:write", "format"]
    cmds: ["bun run lint:fix"]

  lint:workflows:
    desc: "Lint GitHub Actions workflows (actionlint)"
    cmds: ["actionlint"]

  build:
    desc: "Build every package: configs, libraries, variant-cli, variant-ui, then the extensions"
    run: once
    cmds:
      - bun run build
      - task: bin:bun-shebang

  test:
    desc: "Run workspace bun:test suites"
    cmds: ["bun run test"]

  test:node:
    desc: "Run the library and CLI smoke tests that execute dist/ under Node (the mise-pinned node)"
    cmds:
      - task: build
      - node --version
      - bun run --filter variant-api test src/node-runtime.spec.ts
      - bun run --filter variant-cli test src/runtimes.spec.ts

  package:vsix:
    desc: "Build, then package variant-worktrees and chat-renamer into out/*.vsix"
    cmds:
      - task: build
      - bun run --filter ./packages/variant-vscode vsce-package
      - bun run --filter ./packages/chat-renamer-vscode vsce-package

  bleed:vsix:
    desc: "Build, package the variant-worktrees vsix, and unpack it into ../vw-bleeds/variant-vscode"
    cmds:
      - mkdir -p {{.ROOT_DIR}}/../vw-bleeds
      - task: build
      - bun run --filter ./packages/variant-vscode vsce-package
      - bun scripts/package-vsix-unpacked.ts

  bleed:cli:
    desc: "Build the host variant executable and publish it to ../vw-bleeds/variant-cli/bin/variant"
    cmds:
      - mkdir -p {{.ROOT_DIR}}/../vw-bleeds
      - task: build
      - bun scripts/bleed.ts cli

  bleed:mcp:
    desc: "Build the host variant-mcp executable and publish it to ../vw-bleeds/variant-mcp/bin/variant-mcp"
    cmds:
      - mkdir -p {{.ROOT_DIR}}/../vw-bleeds
      - task: build
      - bun scripts/bleed.ts mcp

  bleed:all:
    desc: "Publish the extension, CLI, and MCP server into ../vw-bleeds"
    cmds:
      - task: bleed:vsix
      - task: bleed:cli
      - task: bleed:mcp

  package:cli:
    desc: "Compile the variant CLI to out/variant-<version>-<os>-<arch>[.exe] (TARGET=bun-darwin-arm64, default host)"
    cmds:
      - task: build
      - bun scripts/package-cli.ts {{.TARGET}}

  package:cli:all:
    desc: "Compile the variant CLI for every release platform into out/"
    cmds:
      - task: build
      - bun scripts/package-cli.ts all

  release:version:
    desc: "Print the lockstep release version (fails when package versions differ)"
    cmds: ["bun scripts/release-version.ts"]

  version:incr:patch:
    desc: "Bump the patch version in the root and every packages/*/package.json, and in bun.lock"
    cmds: ["bun scripts/version-incr.ts"]

  release:check:
    desc: "Fail unless this is a clean, current main with one release version and an authenticated gh"
    cmds: ["bun scripts/release-prepare.ts check"]

  release:changelog:
    desc: "Replace Unreleased with the new version section in every CHANGELOG*.md (no Unreleased heading remains) and add the GitHub-generated release notes"
    cmds: ["bun scripts/release-changelog.ts"]

  release:pr:
    desc: "Commit on release/v<version>, push it and open a pull request into main (no tag)"
    cmds: ["bun scripts/release-prepare.ts pr"]

  release:prepare:
    desc: "Prepare a patch release: check, bump the version, write release notes, open the release pull request"
    cmds:
      - task: release:check
      - task: version:incr:patch
      - task: release:changelog
      - task: release:pr

  clean:
    desc: "Remove package dist directories"
    cmds: ["bun run clean"]

  docs:api:
    desc: "Generate TypeDoc API markdown into docs/api"
    cmds: ["bun run docs:api"]
  docs:dev:
    desc: "TypeDoc then VitePress dev server"
    cmds: ["bun run docs:dev"]
  docs:build:
    desc: "TypeDoc then VitePress production build"
    cmds: ["bun run docs:build"]
  docs:preview:
    desc: "Preview the built VitePress site"
    cmds: ["bun run docs:preview"]

  commitlint:
    desc: "Conventional Commits range lint origin/main..HEAD (mise npm:@commitlint/cli)"
    cmds:
      - bash scripts/commitlint-range.sh
  commitlint:edit:
    desc: "Conventional Commits lint of a commit-msg file (mise npm:@commitlint/cli)"
    cmds:
      - commitlint --edit {{.CLI_ARGS}}

  check:changed:
    desc: "hk check on git-changed files (no install)"
    cmds:
      - hk check
  check:all:
    desc: "hk check --all (biome/commitlint/build/test)"
    aliases: [combined]
    cmds:
      - hk check --all --profile ci
  check:full:
    desc: "bun install, then hk check --all --profile ci --profile full"
    aliases: ["combined:hk"]
    deps: [install]
    cmds:
      - hk check --all --profile ci --profile full
