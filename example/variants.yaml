# yaml-language-server: $schema=../packages/variant-config/variants.yaml.schema.json
#
# The example project: a Vite app (fe) and a NestJS app (be) on SQLite.
# `variant watch` runs both dev servers on the host, `variant up` runs both as containers.
db:
  dialect: sqlite

variant:
  abbr: vw # the host of the open URL below; without it the abbreviation would come from this directory's name
  seed: bun scripts/seed.mjs # runs with the variant's database in SQLITE_DATABASE
  storage: {} # a per-variant .storage directory, passed to commands in STORAGE_ROOT
  steps:
    - name: storage
      run: echo "Preparing $VARIANT_SLUG with storage in $STORAGE_ROOT"
      filterLinesRegex: ^Preparing
  implode:
    preRm: [dist, node_modules, .cache, out] # removed below the project and fe/ and be/ before the worktree goes
    discard: [bun.lock] # a lockfile touched by `bun install` does not block the removal
  # be comes first: the nginx of fe resolves the be container by name when it starts.
  watches:
    be:
      kind: nestjs
      dir: be
      watch: bun run start:dev
      env:
        sourceFile: .env # copied from .env.example and amended with the variant's values
        overrides:
          PORT: '${port}'
          SQLITE_DATABASE: '${schema}'
      ready: /api # answers 200 once the server runs
      container:
        dockerfile: be/Dockerfile # SQLITE_DATABASE and PORT are set in the image
        internalPort: 3000
    fe:
      kind: vite
      dir: fe
      watch: bun run dev
      url: http://${slug}.${abbr}.localhost:${port}
      env:
        overrides:
          PORT: '${port}'
          VARIANT_API_PORT: '${be.port}'
      ready: /
      container:
        dockerfile: fe/Dockerfile # builds the app, serves it with nginx and proxies /api/ to the be container
