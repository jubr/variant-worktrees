<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
    <defs>
        <!-- Mask to cut a 1px gap around the top-left square for the wheel background -->
        <mask id="wheel-mask">
            <rect x="0" y="0" width="24" height="24" fill="white" />
            <rect x="0" y="0" width="16" height="16" rx="2.5" fill="black" />
        </mask>

        <!-- Mask to cut the Git logo cutout out of the top-left rounded rectangle -->
        <mask id="git-mask">
            <rect x="0" y="0" width="15" height="15" rx="1.5" fill="white" />
            
            <!-- Scaled & centered git element leaving 0.6px padding (spoke stroke width) -->
            <g transform="translate(-0.533, -0.228) scale(15.678)">
                <!-- Connectors -->
                <path d="M 0.434 0.310 L 0.434 0.822" stroke="black" stroke-width="0.125" fill="none" />

                <path d="M 0.241 0.141 L 0.748 0.594" stroke="black" stroke-width="0.125" fill="none" />

                <!-- Three circular nodes -->
                <ellipse cx="0.434" cy="0.310" rx="0.124" ry="0.111" fill="black" stroke="none" />

                <ellipse cx="0.434" cy="0.822" rx="0.124" ry="0.111" fill="black" stroke="none" />

                <ellipse cx="0.748" cy="0.594" rx="0.124" ry="0.111" fill="black" stroke="none" />
            </g>
        </mask>
    </defs>
    
    <!-- Background Wheel and Spokes (clipped 1px away from the square) -->
    <g mask="url(#wheel-mask)">
        <!-- 3/4 Wheel Outer Arc (12:00 clockwise to 12:45) -->
        <path d="M 12 0.5 A 11.5 11.5 0 1 1 0.5 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" />
        
        <!-- 8 Radial Spokes extending inward leaving 10% empty center -->
        <g stroke="currentColor" stroke-width="0.6" stroke-linecap="round">
            <!-- 12:05 -->
            <line x1="12.60" y1="10.96" x2="17.75" y2="2.04" />
            <!-- 12:10 -->
            <line x1="13.04" y1="11.40" x2="21.96" y2="6.25" />
            <!-- 12:15 -->
            <line x1="13.20" y1="12.00" x2="23.50" y2="12.00" />
            <!-- 12:20 -->
            <line x1="13.04" y1="12.60" x2="21.96" y2="17.75" />
            <!-- 12:25 -->
            <line x1="12.60" y1="13.04" x2="17.75" y2="21.96" />
            <!-- 12:30 -->
            <line x1="12.00" y1="13.20" x2="12.00" y2="23.50" />
            <!-- 12:35 -->
            <line x1="11.40" y1="13.04" x2="6.25" y2="21.96" />
            <!-- 12:40 -->
            <line x1="10.96" y1="12.60" x2="2.04" y2="17.75" />
        </g>
    </g>

    <!-- Top-Left Rounded Square with Git Cutout -->
    <rect x="0" y="0" width="15" height="15" rx="1.5" fill="currentColor" mask="url(#git-mask)" />
</svg>